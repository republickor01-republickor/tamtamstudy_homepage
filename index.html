<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMTAM STUDY - 방문을 환영합니다</title>
     <!-- 공통 루트 경로 설정 -->
    <!-- 👇 이 스크립트 하나면 경로 고민 끝! -->
    <script>
        (function() {
            const isGitHub = window.location.hostname.includes("github.io");
            const repoName = "/tamtamstudy_homepage"; // 본인 레포지토리 이름
            let baseHref = "";
            if (isGitHub) {
                baseHref = window.location.origin + repoName + '/';
            } else {
                baseHref = '/';
            }
            // origin과 repoName, 그리고 최종 합쳐진 주소를 경고창으로 띄워 확인
            alert("window.location.origin: " + window.location.origin + "\n" +
                  "repoName: " + repoName + "\n" +
                  "최종 base 주소: " + baseHref);
            document.write('<base href="' + baseHref + '">');
        })();
    </script>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="/web/css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="welcome-header">
            <h1>TAMTAM STUDY 입니다.</h1>
            <p>방문을 환영합니다.</p>
        </div>

        <div class="explore-section">
            <a href="/web/explore.html" class="btn-explore">구경하기</a>
        </div>

        <div class="login-buttons">
            <a href="/web/teacherlogin.html" class="btn-login btn-teacher">선생님 로그인</a>
            <a href="#" class="btn-login btn-student" onclick="alert('학생 로그인 기능은 추후 오픈 예정입니다.'); return false;">학생 로그인</a>
            <a href="#" class="btn-login btn-parent" onclick="alert('부모님 로그인 기능은 추후 오픈 예정입니다.'); return false;">부모님 로그인</a>
        </div>
    </div>
</body>
</html>
