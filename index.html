<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 (TAMTAM STUDY)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        body {
            background-color: #1e5d77; /* 보내주신 차분한 청록/블루 계열 배경 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #d8f3dc;
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #1e5d77;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            background-color: #d8f3dc;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TAMTAM STUDY</h1>
        <p>체계적이고 안전한 스마트 학습 관리 플랫폼</p>
        <!-- web 폴더 안에 있는 teacher.html로 연결 -->
        <a href="web/teacher.html" class="btn">선생님 전용 로그인</a>
    </div>
</body>
</html>
