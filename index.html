<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMTAM STUDY</title>
    <style>
        /* 화면이 흔들리지 않도록 전체 레이아웃 고정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* 스크롤 없이 화면에 꽉 차도록 고정 */
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 메인 컨테이너 */
        .main-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        /* 타이틀 스타일 */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
            color: #f1c40f;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #ecf0f1;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        /* 버튼 배치 영역 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* 링크 버튼 스타일 */
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background-color: #3498db;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #2ecc71;
        }

        .btn-secondary:hover {
            background-color: #27ae60;
        }

        /* 하단 카피라이트 */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.85rem;
            color: #95a5a6;
        }

        /* 모바일 최적화 대응 */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            p.subtitle {
                font-size: 1rem;
                margin-bottom: 30px;
            }
            .btn {
                padding: 15px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>TAMTAM STUDY</h1>
        <p class="subtitle">수학은 그냥 해보는 거야</p>

        <div class="button-group">
            <!-- 첫 번째 기능: 학생 등록 화면 링크 -->
            <a href="https://naver.me/xHEthm8O" class="btn">예비 초등 3학년 설문조사</a>
            
            <!-- 두 번째 기능: 문자 보내기 화면 링크 -->
            <a href="https://form.naver.com/response/93lyaq2eGKQ" class="btn btn-secondary">1:1 맞춤 학습 상담 신청서</a>
        </div>
    </div>

    <footer>
        &copy; TAMTAM STUDY. All rights reserved.
    </footer>

</body>
</html>
