<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 - 선생님 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 대시보드 전용 추가 스타일 */
        .dashboard-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
        }
        .dashboard-header h2 {
            font-size: 1.8rem;
            margin: 0;
        }
        .logout-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background-color: #fa5252;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .menu-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }
        .menu-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .menu-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #d8f3dc;
        }
        .menu-card p {
            font-size: 0.9rem;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>📚 탐탐스터디 관리자 대시보드</h2>
            <button id="logout-btn" class="logout-btn">로그아웃</button>
        </div>

        <p style="margin-bottom: 25px; color: #d8f3dc;">환영합니다, 선생님! 처리할 업무 메뉴를 선택해 주세요.</p>

        <div class="menu-grid">
            <!-- 회원 등록 메뉴 -->
            <a href="#" class="menu-card" onclick="alert('회원 등록 페이지 준비 중입니다.'); return false;">
                <h3>👤 회원 등록</h3>
                <p>신규 학생 및 학부모 정보 등록</p>
            </a>

            <!-- 데이터 조회 메뉴 -->
            <a href="#" class="menu-card" onclick="alert('데이터 조회 페이지 준비 중입니다.'); return false;">
                <h3>🔍 데이터 조회</h3>
                <p>학생 학습 현황 및 기록 검색</p>
            </a>

            <!-- 일일 업무 정리 메뉴 -->
            <a href="#" class="menu-card" onclick="alert('일일 업무 정리 페이지 준비 중입니다.'); return false;">
                <h3>📋 일일 업무 정리</h3>
                <p>오늘의 학습 스케줄 및 메모 관리</p>
            </a>

            <!-- 시스템 설정 메뉴 -->
            <a href="#" class="menu-card" onclick="alert('설정 페이지 준비 중입니다.'); return false;">
                <h3>⚙️ 계정 및 설정</h3>
                <p>선생님 계정 관리 및 환경 설정</p>
            </a>
        </div>
    </div>

    <!-- 로그아웃 및 보안 체크 스크립트 -->
    <script type="module">
        import { auth } from './js/firebase.js';
        import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 로그인 상태 확인 (로그인 없이 주소로 바로 들어오는 것 방지)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("로그인이 필요한 페이지입니다.");
                window.location.href = 'teacherlogin.html';
            }
        });

        // 로그아웃 버튼 기능
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                alert("안전하게 로그아웃 되었습니다.");
                window.location.href = '../index.html';
            } catch (error) {
                console.error("로그아웃 에러:", error);
            }
        });
    </script>
</body>
</html>
