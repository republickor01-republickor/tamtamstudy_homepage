<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 - 구경하기</title>
    <!-- 👇 GitHub 및 로컬 환경 모두 완벽 대응하는 동적 Base 스크립트 -->
    <script>
        (function() {
            const hostname = window.location.hostname;
            const isGitHub = hostname.includes("github.io");
            const repoName = "/tamtamstudy_homepage/"; // 본인의 GitHub 저장소 이름
            
            if (isGitHub) {
                document.write('<base href="' + window.location.origin + repoName + '/">');
            } else {
                document.write('<base href="/">');
            }
        })();
    </script>
    
    <!-- 👇 둘러보기 페이지(explore.html) 반응형 통합 스타일 -->
    <style>
        /* 공통 초기화 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e5d77 0%, #113f52 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh; /* 모바일 브라우저 주소창 영역 대응 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* [모바일 기본] 둘러보기 컨테이너 기본 스타일 */
        .explore-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .explore-header {
            text-align: center;
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .explore-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .explore-header p {
            color: #d8f3dc;
            font-size: 0.95rem;
        }

        /* [모바일 기본] 메뉴 버튼 영역 세로 배치 */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
        }

        .grid-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 15px;
            border-radius: 12px;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 은은한 브랜드 포인트 호버 컬러 */
        .grid-btn.blog:hover { background: rgba(3, 207, 93, 0.25); border-color: rgba(3, 207, 93, 0.5); }
        .grid-btn.youtube:hover { background: rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.4); }
        .grid-btn.intro1:hover { background: rgba(58, 180, 242, 0.25); border-color: rgba(58, 180, 242, 0.5); }
        .grid-btn.intro2:hover { background: rgba(46, 204, 113, 0.25); border-color: rgba(46, 204, 113, 0.5); }

        .grid-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .grid-btn.disabled {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            pointer-events: none;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #d8f3dc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* 🖥️ [PC / 태블릿 환경 웹 스타일 확장] 화면 너비가 768px 이상일 때 */
        @media (min-width: 768px) {
            .explore-container {
                max-width: 760px; /* PC 해상도 맞춤 확장 */
                padding: 50px 40px;
            }

            .explore-header {
                margin-bottom: 35px;
            }

            .explore-header h2 {
                font-size: 2.2rem;
            }

            /* 버튼들을 한눈에 보이게 2열 바둑판(Grid) 형태로 변경 */
            .button-grid {
                grid-template-columns: repeat(2, 1fr); 
                gap: 16px;
                margin-bottom: 35px;
            }

            /* 버튼 크기 밸런스 조정 */
            .grid-btn {
                padding: 18px 20px;
                font-size: 1.05rem;
            }
            
            /* 홀수 개인 마이페이지(준비중) 버튼을 하단 가로 전체로 채워 균형을 맞춤 */
            .grid-btn.full-width {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body>
    <div class="explore-container">
        <div class="explore-header">
            <h2>✨ 탐탐스터디 둘러보기</h2>
            <p>핵심 콘텐츠를 자유롭게 구경해보세요!</p>
        </div>
        
        <!-- 메뉴 버튼 영역 -->
        <div class="button-grid">
            <a href="https://blog.naver.com/tamtamstudy" target="_blank" class="grid-btn blog">📝 탐탐에듀 블로그</a>
            <a href="https://www.youtube.com/@%EC%9D%80%ED%95%98%EC%88%98-k7w" target="_blank" class="grid-btn youtube">📺 은하수 유튜브</a>
            <a href="web/index_home/index_home.html" class="grid-btn intro1">탐탐스터디 소개</a>
            <a href="web/index_home/index_home01.html" class="grid-btn intro2">✅ tamtamStudy 소개2</a>
            <a href="#" class="grid-btn disabled full-width">👤 마이페이지 (준비중)</a>
        </div>

        <a href="./index.html" class="back-link">← 메인 화면으로 돌아가기</a>
    </div>
</body>
</html>
