<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 - 구경하기</title>
    <!-- 👇 GitHub 및 로컬 환경 모두 완벽 대응하는 동적 Base 스크립트 -->
    <script>
        (function() {
            const hostname = window.location.hostname;
            const isGitHub = hostname.includes("github.io");
            const repoName = "/tamtamstudy_homepage"; // 본인의 GitHub 저장소 이름
            
            if (isGitHub) {
                document.write('<base href="' + window.location.origin + repoName + '/">');
            } else {
                document.write('<base href="/">');
            }
        })();
    </script>


    
    <!-- 👇 둘러보기 페이지(explore.html) 전용 통합 스타일 -->
    <style>
        /* 공통 초기화 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e5d77 0%, #113f52 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh; /* 모바일 브라우저 주소창 영역 대응 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 둘러보기 페이지 전용 스타일 */
        .explore-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            max-height: 85dvh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .explore-header {
            text-align: center;
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .explore-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .explore-header p {
            color: #d8f3dc;
            font-size: 0.95rem;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .button-grid::-webkit-scrollbar {
            width: 6px;
        }

        .button-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .grid-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 15px;
            border-radius: 12px;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .grid-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .grid-btn.disabled {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            pointer-events: none;
        }

        .back-link {
            display: block;
            text-align: center;
            color: #d8f3dc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="explore-container">
        <div class="explore-header">
            <h2>✨ 탐탐스터디 둘러보기</h2>
            <p>핵심 콘텐츠를 자유롭게 구경해보세요!</p>
        </div>
        
        <!-- 메뉴 버튼 영역 -->
        <div class="button-grid">
            <a href="https://blog.naver.com/tamtamedu" target="_blank" class="grid-btn">📝 탐탐에듀 블로그</a>
            <a href="http://www.youtube.com/@%EC%9D%80%ED%95%98%EC%88%98-k7w" target="_blank" class="grid-btn">📺 은하수 유튜브</a>
            <a href="web/index_home/index_home.html" class="grid-btn">탐탐스터디 소개</a>
            <a href="web/index_home/index_home01.html" class="grid-btn">✅ tamtamStudy 소개2</a>
            <a href="#" class="grid-btn disabled">👤 마이페이지 (준비중)</a>
        </div>

        <a href="./index.html" class="back-link">← 메인 화면으로 돌아가기</a>
    </div>
</body>
</html>
