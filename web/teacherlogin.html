<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 - 선생님 로그인</title>
    <!-- web 폴더 안에서의 올바른 공통 스타일 경로 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="card">
        <h2>Teacher Login</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">선생님 이메일</label>
                <input type="email" id="email" required placeholder="example@tamtamstudy.com">
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" required placeholder="비밀번호를 입력하세요">
            </div>
            <button type="submit" class="btn">로그인</button>
            <div id="error-message"></div>
        </form>
        <a href="../index.html" class="back-link">← 메인 화면으로 돌아가기</a>
    </div>

    <!-- 로그인 기능 모듈 실행 스크립트 -->
    <script type="module">
        import { initLogin } from './js/auth.js';
        initLogin();
    </script>
</body>
</html>
