<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐탐스터디 - 원페이지 통합 홈</title>
    
    <!-- 기존 공통 스타일 링크 -->
    <link rel="stylesheet" href="/web/css/style.css">
    <style>
        /* 원페이지 스크롤을 위한 추가 스타일 */
        html {
            scroll-behavior: smooth; /* 상단 링크 클릭 시 부드럽게 스크롤 이동 */
        }
        
        body {
            display: block; /* 기존 flex 중앙 정렬을 해제하고 세로 배치로 변경 */
            margin: 0;
            padding-top: 80px; /* 상단 고정 네비게이션 공간 확보 */
        }

        /* 상단 고정 네비게이션 바 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 63, 82, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px 20px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .top-nav a {
            color: #d8f3dc;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* 각 섹션 영역 설정 */
        .page-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- 상단 고정 네비게이션 (각 페이지/섹션으로 이동하는 링크) -->
    <nav class="top-nav">
        <a href="#section1">메인 홈</a>
        <a href="#section2">둘러보기</a>
        <a href="#section3">선생님 로그인</a>
        <a href="#section4">학생 로그인</a>
        <a href="#section5">학부모 로그인</a>
        <a href="/index.html">← 최상위 메인으로</a>
    </nav>

    <!-- 1페이지: 메인 홈 섹션 -->
    <section id="section1" class="page-section">
        <div class="main-container">
            <div class="welcome-header">
                <h1>탐탐스터디</h1>
                <p>스마트한 학습 관리의 시작점</p>
            </div>
            <div class="explore-section">
                <a href="#section2" class="btn-explore">콘텐츠 둘러보기</a>
            </div>
        </div>
    </section>

    <!-- 2페이지: 둘러보기 섹션 -->
    <section id="section2" class="page-section">
        <div class="explore-container">
            <div class="explore-header">
                <h2>서비스 둘러보기</h2>
                <p>탐탐스터디의 다양한 기능을 확인해보세요.</p>
            </div>
            <div class="button-grid">
                <div class="grid-btn">출석 체크 시스템</div>
                <div class="grid-btn">온라인 과제 제출</div>
                <div class="grid-btn">성적 분석 리포트</div>
            </div>
        </div>
    </section>

    <!-- 3페이지: 선생님 로그인 섹션 -->
    <section id="section3" class="page-section">
        <div class="card">
            <h2>Teacher Login</h2>
            <form>
                <div class="input-group">
                    <label>선생님 이메일</label>
                    <input type="email" placeholder="teacher@tamtamstudy.com">
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" placeholder="비밀번호 입력">
                </div>
                <button type="button" class="btn">로그인</button>
            </form>
        </div>
    </section>

    <!-- 4페이지: 학생 로그인 섹션 -->
    <section id="section4" class="page-section">
        <div class="card">
            <h2>Student Login</h2>
            <form>
                <div class="input-group">
                    <label>학생 아이디 / 이메일</label>
                    <input type="text" placeholder="student ID">
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" placeholder="비밀번호 입력">
                </div>
                <button type="button" class="btn">로그인</button>
            </form>
        </div>
    </section>

    <!-- 5페이지: 학부모 로그인 섹션 -->
    <section id="section5" class="page-section">
        <div class="card">
            <h2>Parent Login</h2>
            <form>
                <div class="input-group">
                    <label>학부모 연락처 / 이메일</label>
                    <input type="text" placeholder="010-0000-0000">
                </div>
                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" placeholder="비밀번호 입력">
                </div>
                <button type="button" class="btn">로그인</button>
            </form>
        </div>
    </section>

</body>
</html>
